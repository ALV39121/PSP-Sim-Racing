name: Build PSP EBOOT

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Compile EBOOT.PBP
        run: make

      - name: Upload Hasil EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT-PSP
          path: EBOOT.PBP
          
